name: Bug report
description: Report a reproducible runtime or build problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: You can attach the dashboard-generated diagnostic report after reviewing it for private data. Optional engine logs can contain prompts or local paths. Remove access tokens, credentials, and private model data before posting.
  - type: input
    id: version
    attributes:
      label: Runtime version / commit
      placeholder: 0.1.0-dev or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10/11 x64
        - Ubuntu/Debian x64
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Build and hardware environment
      description: Compiler, CMake, CPU, RAM, GPU/VRAM, driver/backend if applicable.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report summary or relevant excerpt
      description: Attach the exported local-ai-runtime-diagnostics.txt file if useful, or paste only the relevant sanitized lines. Review it for private details first.
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Additional sanitized log excerpt
      render: text
    validations:
      required: false
