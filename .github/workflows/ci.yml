name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 / MSVC
            os: windows-2022
            platform: windows
          - name: Ubuntu x64 / GCC
            os: ubuntu-24.04
            platform: linux
          - name: macOS 15 Intel / Apple Clang
            # The ARM64 macOS-15 pool showed repeated runner-allocation failures.
            # Keep macOS CI on the separately labelled Intel hosted pool for now.
            os: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python for HTTP integration test
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libboost-dev libcurl4-openssl-dev libarchive-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja pkg-config boost curl libarchive openssl@3

      - name: Configure Windows (vcpkg manifest mode)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
            throw 'VCPKG_INSTALLATION_ROOT is missing from this hosted runner.'
          }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path $toolchain)) { throw "vcpkg toolchain missing: $toolchain" }
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_MANIFEST_MODE=ON -DLAR_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            PREFIX_PATH="$(brew --prefix curl);$(brew --prefix libarchive);$(brew --prefix openssl@3)"
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLAR_BUILD_TESTS=ON "-DCMAKE_PREFIX_PATH=${PREFIX_PATH}"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLAR_BUILD_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Repeat native macOS process-spawn smoke test for flakiness
        if: runner.os == 'macOS'
        run: ctest --test-dir build -C Release --repeat until-fail:5 -R '^lar_http_smoke$' --output-on-failure

      - name: Smoke-test Windows developer launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = $null
          try {
            $runtime = & .\scripts\Start-LocalAIRuntime.ps1 -NoBrowser -PassThru
            if (-not $runtime -or -not $runtime.Id) { throw 'Launcher did not return the runtime process.' }
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 3
            if ($health.status -ne 'ok') { throw "Unexpected health response: $($health | ConvertTo-Json -Compress)" }
            Write-Host "Windows launcher smoke test passed with PID $($runtime.Id)."
          } finally {
            if ($runtime -and -not $runtime.HasExited) {
              Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue
              try { Wait-Process -Id $runtime.Id -Timeout 5 -ErrorAction SilentlyContinue } catch { }
            }
          }

      - name: Smoke-test Unix developer launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/start-runtime.sh > launcher-smoke.log 2>&1 &
          launcher_pid=$!
          cleanup() {
            kill -TERM "$launcher_pid" 2>/dev/null || true
            wait "$launcher_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/lar-health.json; then ready=1; break; fi
            if ! kill -0 "$launcher_pid" 2>/dev/null; then cat launcher-smoke.log; exit 1; fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then cat launcher-smoke.log; echo 'Unix launcher did not become ready.' >&2; exit 1; fi
          grep -q '"status":"ok"' /tmp/lar-health.json
          echo 'Unix developer launcher smoke test passed.'

      - name: Validate JavaScript and product metadata
        shell: bash
        run: |
          node --check web/app.js
          node --check site/app.js
          python -m json.tool site/product.json >/dev/null
          python -m json.tool config/engines.example.json >/dev/null
