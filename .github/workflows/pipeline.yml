name: Build, test, package & publish

on:
  # One end-to-end run: plan version, build/test/package each platform once,
  # then tag and publish those exact artifacts and deploy Pages. The release job
  # creates tags with GITHUB_TOKEN, so tag pushes do not start a second build.
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Keep the weekly macOS maintenance check inside the canonical workflow;
    # Windows/Linux and publish jobs are skipped for scheduled runs.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build for a dry-run (for example 0.1.0-alpha). Does not publish a release.'
        required: true
        default: '0.1.0-alpha'
        type: string

permissions:
  contents: read

concurrency:
  group: local-ai-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan version and release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Checkout complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test release version planner and unified workflow contract
        run: |
          python tests/next_alpha_version_test.py
          python tests/unified_pipeline_contract.py

      - name: Plan version for this run
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag=''
          release=false
          if [[ "$EVENT_NAME" == 'push' && "$REF_NAME" == 'refs/heads/main' ]]; then
            tag="$(python scripts/next_alpha_version.py)"
            version="${tag#v}"
            release=true
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            version="${INPUT_VERSION#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid dry-run version: $version" >&2; exit 1; }
          else
            version='0.1.0-dev'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo '## Release plan'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build version: \`$version\`"
            if [[ -n "$tag" ]]; then echo "- Release tag: \`$tag\`"; else echo '- Release: dry run / validation only'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: [plan]
    env:
      LAR_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    if: ${{ github.event_name != 'schedule' }}
    name: Windows x64 build / test / package
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Record job start time
        id: timing-start
        shell: pwsh
        run: |
          "epoch=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up .NET SDK for the Windows desktop shell
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate web assets and manifests
        shell: pwsh
        run: |
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check site/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/site_smoke.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool site/product.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool config/engines.example.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool web/locales/en.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool web/locales/tr.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool catalog/schemas/activity-v1.schema.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Identify vcpkg cache identity
        id: vcpkg-cache-identity
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
            throw 'vcpkg is not available on this runner.'
          }
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path $vcpkgExe)) { throw "vcpkg executable not found: $vcpkgExe" }

          $vcpkgCommit = (& git -C $vcpkgRoot rev-parse HEAD 2>$null | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $vcpkgCommit -notmatch '^[0-9a-fA-F]{40}$') {
            $versionText = (& $vcpkgExe version 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($versionText)) {
              throw 'Could not identify the installed vcpkg version for safe cache keys.'
            }
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($versionText)
            $hash = [System.Security.Cryptography.SHA256]::HashData($bytes)
            $vcpkgCommit = [Convert]::ToHexString($hash).ToLowerInvariant().Substring(0, 16)
          } else {
            $vcpkgCommit = $vcpkgCommit.Substring(0, 12).ToLowerInvariant()
          }

          # Key by the actual compiler version, not the frequently changing
          # hosted-image label. vcpkg still independently validates ABI hashes.
          $compiler = 'msvc-unknown'
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (Test-Path $vsWhere) {
            $vsPath = (& $vsWhere -latest -products '*' -property installationPath 2>$null | Select-Object -First 1)
            if ($vsPath) {
              $msvcRoot = Join-Path $vsPath 'VC/Tools/MSVC'
              $msvcDir = Get-ChildItem $msvcRoot -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
              if ($msvcDir) {
                $cl = Join-Path $msvcDir.FullName 'bin/Hostx64/x64/cl.exe'
                if (Test-Path $cl) { $compiler = (Get-Item $cl).VersionInfo.FileVersion }
              }
            }
          }
          if ($compiler -eq 'msvc-unknown') {
            throw 'Could not identify the MSVC compiler version; refusing to use an ambiguous binary-cache key.'
          }
          $identity = "vcpkg-$vcpkgCommit-msvc-$compiler" -replace '[^A-Za-z0-9._-]', '_'
          "identity=$identity" >> $env:GITHUB_OUTPUT

          $binaryCache = Join-Path $env:RUNNER_TEMP 'lar-vcpkg-binary-cache'
          $downloadsCache = Join-Path $env:RUNNER_TEMP 'lar-vcpkg-downloads'
          New-Item -ItemType Directory -Force -Path $binaryCache, $downloadsCache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          "VCPKG_DOWNLOADS=$downloadsCache" >> $env:GITHUB_ENV
          Write-Host "vcpkg cache identity: $identity"
          Write-Host "vcpkg binary cache: $binaryCache"
          Write-Host "vcpkg download cache: $downloadsCache"

      - name: Start vcpkg cache restore timer
        id: cache-restore-start
        shell: pwsh
        run: |
          "epoch=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg dependency caches
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}\lar-vcpkg-binary-cache
            ${{ runner.temp }}\lar-vcpkg-downloads
          key: windows-vcpkg-${{ runner.arch }}-${{ steps.vcpkg-cache-identity.outputs.identity }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            windows-vcpkg-${{ runner.arch }}-${{ steps.vcpkg-cache-identity.outputs.identity }}-

      - name: Record vcpkg cache restore duration
        id: cache-restore-duration
        if: ${{ always() }}
        shell: pwsh
        run: |
          $start = '${{ steps.cache-restore-start.outputs.epoch }}'
          $seconds = if ($start -match '^\d+$') { [math]::Max(0, [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$start) } else { 0 }
          "seconds=$seconds" >> $env:GITHUB_OUTPUT

      - name: Report dependency cache status
        shell: pwsh
        run: |
          if ('${{ steps.vcpkg-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host 'vcpkg binary/source cache: exact hit' -ForegroundColor Green
          } else {
            Write-Host 'vcpkg binary/source cache: miss or compatible fallback; vcpkg will validate package ABI hashes.' -ForegroundColor Yellow
          }

      - name: Validate PowerShell maintainer tooling syntax
        shell: pwsh
        run: |
          foreach ($relativePath in @('Publish-LocalAIRuntime.ps1', 'scripts/Publish-LocalAIRuntime.ps1', 'scripts/Test-LocalAIRuntimeRealEngine.ps1', 'scripts/Start-LocalAIRuntime.ps1', 'scripts/Apply-LocalAIRuntimeUpdate.ps1', 'scripts/Apply-LocalAIRuntimeDesktopUpdate.ps1', 'tests/update_apply_powershell51_validateonly.ps1', 'tests/desktop_update_smoke.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $path = Join-Path $env:GITHUB_WORKSPACE $relativePath
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell syntax is invalid in ${relativePath}: $($parseErrors -join '; ')" }
          }

      - name: Smoke-test publisher Git stderr handling (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & .\tests\publisher_git_stderr_smoke.ps1

      - name: Configure
        id: configure
        shell: pwsh
        run: |
          $version = $env:LAR_RELEASE_VERSION -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) { throw 'vcpkg is not available on this runner.' }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          $configureTimer = [System.Diagnostics.Stopwatch]::StartNew()
          & cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_MANIFEST_MODE=ON "-DLAR_VERSION=$version" -DLAR_BUILD_TESTS=ON 2>&1 | Tee-Object -FilePath configure-vcpkg.log
          $configureExitCode = $LASTEXITCODE
          $configureTimer.Stop()
          $configureSeconds = [math]::Round($configureTimer.Elapsed.TotalSeconds, 2)
          "seconds=$configureSeconds" >> $env:GITHUB_OUTPUT
          if ($configureExitCode -ne 0) {
            Write-Host 'CMake/vcpkg configure failed. Final diagnostic lines:' -ForegroundColor Red
            Get-Content configure-vcpkg.log -Tail 160
            exit $configureExitCode
          }

      - name: Measure vcpkg cache contents
        id: vcpkg-cache-stats
        if: ${{ always() }}
        shell: pwsh
        run: |
          $binaryCache = Join-Path $env:RUNNER_TEMP 'lar-vcpkg-binary-cache'
          $downloadsCache = Join-Path $env:RUNNER_TEMP 'lar-vcpkg-downloads'
          $binaryFiles = @(Get-ChildItem -LiteralPath $binaryCache -File -Recurse -ErrorAction SilentlyContinue)
          $downloadFiles = @(Get-ChildItem -LiteralPath $downloadsCache -File -Recurse -ErrorAction SilentlyContinue)
          $binaryBytes = ($binaryFiles | Measure-Object -Property Length -Sum).Sum
          $downloadBytes = ($downloadFiles | Measure-Object -Property Length -Sum).Sum
          if ($null -eq $binaryBytes) { $binaryBytes = 0 }
          if ($null -eq $downloadBytes) { $downloadBytes = 0 }
          "binary_files=$($binaryFiles.Count)" >> $env:GITHUB_OUTPUT
          "binary_mb=$([math]::Round($binaryBytes / 1MB, 1))" >> $env:GITHUB_OUTPUT
          "download_files=$($downloadFiles.Count)" >> $env:GITHUB_OUTPUT
          "download_mb=$([math]::Round($downloadBytes / 1MB, 1))" >> $env:GITHUB_OUTPUT
          Write-Host "vcpkg binary cache after configure: $($binaryFiles.Count) files, $([math]::Round($binaryBytes / 1MB, 1)) MiB"
          Write-Host "vcpkg downloads cache after configure: $($downloadFiles.Count) files, $([math]::Round($downloadBytes / 1MB, 1)) MiB"

      - name: Save vcpkg dependency caches
        if: ${{ always() && steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}\lar-vcpkg-binary-cache
            ${{ runner.temp }}\lar-vcpkg-downloads
          key: windows-vcpkg-${{ runner.arch }}-${{ steps.vcpkg-cache-identity.outputs.identity }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Build
        id: build
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $exitCode = 0
          try {
            & cmake --build build --config Release --parallel 2
            $exitCode = $LASTEXITCODE
          } finally {
            $timer.Stop()
            "seconds=$([math]::Round($timer.Elapsed.TotalSeconds, 2))" >> $env:GITHUB_OUTPUT
          }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Verify executable version
        shell: pwsh
        run: |
          $expected = $env:LAR_RELEASE_VERSION -replace '^v', ''
          $actual = & .\build\Release\local-ai-runtime.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $expected) { throw "Version check failed: expected $expected; got $actual" }

      - name: Test
        id: test
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $exitCode = 0
          try {
            & ctest --test-dir build -C Release --output-on-failure
            $exitCode = $LASTEXITCODE
          } finally {
            $timer.Stop()
            "seconds=$([math]::Round($timer.Elapsed.TotalSeconds, 2))" >> $env:GITHUB_OUTPUT
          }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Smoke-test Windows developer launcher (PR validation)
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $runtime = $null
          try {
            $runtime = & .\scripts\Start-LocalAIRuntime.ps1 -NoBrowser -PassThru
            if (-not $runtime -or -not $runtime.Id) { throw 'Launcher did not return the runtime process.' }
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($runtime.HasExited) { throw "Runtime exited before health check (code $($runtime.ExitCode))." }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 1
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Developer launcher did not pass /health within 10 seconds.' }
          } finally {
            if ($runtime -and -not $runtime.HasExited) {
              Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue
              try { Wait-Process -Id $runtime.Id -Timeout 5 -ErrorAction SilentlyContinue } catch { }
            }
          }

      - name: Build the self-contained Windows desktop shell
        shell: pwsh
        run: |
          $version = $env:LAR_RELEASE_VERSION -replace '^v', ''
          dotnet publish desktop/LocalAIRuntime.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$version" --output dist/desktop-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/desktop-publish/LocalAIRuntime.Desktop.exe')) { throw 'Self-contained desktop shell executable was not produced.' }

      - name: Package portable Windows runtime
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        id: package
        shell: pwsh
        run: |
          $packageTimer = [System.Diagnostics.Stopwatch]::StartNew()
          try {
          $version = $env:LAR_RELEASE_VERSION -replace '^v', ''
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist/stage'
          New-Item -ItemType Directory -Force -Path $stage, (Join-Path $stage 'web'), (Join-Path $stage 'config'), (Join-Path $stage 'scripts') | Out-Null
          Copy-Item 'build/Release/local-ai-runtime.exe' $stage
          Copy-Item 'web/*' (Join-Path $stage 'web') -Recurse -Force
          Copy-Item 'config/engines.example.json' (Join-Path $stage 'config')
          Copy-Item 'LICENSE' $stage
          Copy-Item 'Start-LocalAIRuntime.cmd' $stage
          Copy-Item 'scripts/Start-LocalAIRuntime.ps1' (Join-Path $stage 'scripts')
          Copy-Item 'scripts/Apply-LocalAIRuntimeUpdate.ps1' (Join-Path $stage 'scripts')
          foreach ($scriptName in @('Start-LocalAIRuntime.ps1', 'Apply-LocalAIRuntimeUpdate.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $stage "scripts/$scriptName"), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "Packaged PowerShell syntax check failed for ${scriptName}: $($parseErrors -join '; ')" }
          }
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg_installed/x64-windows/bin'
          if (Test-Path $vcpkgBin) { Get-ChildItem $vcpkgBin -Filter '*.dll' | Copy-Item -Destination $stage -Force }
          @"
          Local AI Runtime $version — Windows x64

          First run: double-click Start-LocalAIRuntime.cmd.
          The dashboard opens in your browser. If startup fails, the window
          stays open so you can read the error.

          Requirements: Windows 10/11 x64. This package includes the runtime,
          not AI model weights or external inference engines. Use the dashboard
          component library to install an approved engine and model.
          "@ | Set-Content -Encoding utf8 (Join-Path $stage 'README-INSTALL.txt')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $package = Join-Path $env:GITHUB_WORKSPACE 'dist/local-ai-runtime-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $package -Force

          # Smoke-test the actual archive, not only the build-tree executable.
          $verify = Join-Path $env:GITHUB_WORKSPACE 'dist/verify-windows'
          if (Test-Path $verify) { Remove-Item -Recurse -Force $verify }
          Expand-Archive -Path $package -DestinationPath $verify -Force
          $actual = & (Join-Path $verify 'local-ai-runtime.exe') --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $version) { throw "Packaged Windows executable failed version check: $actual" }
          if (-not (Test-Path (Join-Path $verify 'web/index.html'))) { throw 'Packaged dashboard is missing.' }
          foreach ($locale in @('en', 'tr')) {
            if (-not (Test-Path (Join-Path $verify "web/locales/$locale.json"))) { throw "Packaged dashboard locale is missing: $locale" }
          }
          if (-not (Test-Path (Join-Path $verify 'Start-LocalAIRuntime.cmd'))) { throw 'Double-click Windows launcher is missing.' }
          if (-not (Test-Path (Join-Path $verify 'scripts/Start-LocalAIRuntime.ps1'))) { throw 'Packaged Windows launcher is missing.' }
          if (-not (Test-Path (Join-Path $verify 'scripts/Apply-LocalAIRuntimeUpdate.ps1'))) { throw 'Packaged Windows update helper is missing.' }

          # Validate that the extracted, relocatable package can actually serve HTTP.
          $runtime = $null
          try {
            $launcher = Join-Path $verify 'scripts/Start-LocalAIRuntime.ps1'
            $runtime = & $launcher -NoBrowser -PassThru
            if (-not $runtime -or -not $runtime.Id) { throw 'Packaged Windows launcher did not return the runtime process.' }
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($runtime.HasExited) { throw "Packaged runtime exited before health check (code $($runtime.ExitCode))." }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 1
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Extracted Windows release launcher did not pass /health within 10 seconds.' }
          } finally {
            if ($runtime -and -not $runtime.HasExited) {
              Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue
              try { Wait-Process -Id $runtime.Id -Timeout 5 -ErrorAction SilentlyContinue } catch { }
            }
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/update_apply_smoke.ps1') -PackagePath $package -Version $version

          # The installed desktop app includes the existing dashboard in WebView2,
          # the C++ runtime, safe launcher/update helpers and a per-user installer.
          $installerStage = Join-Path $env:GITHUB_WORKSPACE 'dist/stage-installer'
          if (Test-Path $installerStage) { Remove-Item -Recurse -Force $installerStage }
          New-Item -ItemType Directory -Force -Path $installerStage | Out-Null
          Copy-Item -Path (Join-Path $stage '*') -Destination $installerStage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'dist/desktop-publish/*') -Destination $installerStage -Recurse -Force
          Copy-Item 'scripts/Apply-LocalAIRuntimeDesktopUpdate.ps1' (Join-Path $installerStage 'scripts') -Force
          Copy-Item 'installer/local-ai-runtime.ico' $installerStage -Force
          $desktopMarker = @{ kind = 'installed-desktop'; update_mode = 'full-setup-installer'; installer_asset_name = 'local-ai-runtime-windows-x64-setup.exe' } | ConvertTo-Json
          $desktopMarker | Set-Content -Encoding utf8 (Join-Path $installerStage 'web/desktop-shell.json')
          @"
          Local AI Runtime $version — Windows desktop app

          Open Local AI Runtime from the Start menu. The dashboard opens in its own desktop window;
          no command prompt or PowerShell window is required. Closing the window minimizes the app
          to the notification area. Choose “Exit and stop local engines” there to stop it completely.

          Settings, engines, models and logs are stored in %LOCALAPPDATA%\LocalAIRuntime and are
          preserved when updating or uninstalling the program. This alpha installer is unsigned.
          "@ | Set-Content -Encoding utf8 (Join-Path $installerStage 'README-INSTALL.txt')

          $bootstrapper = Join-Path $env:GITHUB_WORKSPACE 'dist/MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?i)Microsoft Corporation') {
            throw "The downloaded WebView2 bootstrapper did not have a valid Microsoft signature (status=$($signature.Status))."
          }

          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe')
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) { throw 'Inno Setup is missing and Chocolatey is not available on this Windows runner.' }
            & choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE." }
            $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          & $iscc "/DAppVersion=$version" "/DSourceDir=$installerStage" "/DOutputDir=$outputDir" "/DWebViewBootstrapper=$bootstrapper" 'installer/LocalAIRuntime.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $setup = Join-Path $outputDir 'local-ai-runtime-windows-x64-setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw 'The Windows setup installer was not produced.' }

          # Install and uninstall silently in a clean, isolated path. This checks
          # the actual installer payload without opening a console or launching the UI.
          # Inno Setup expects a fully qualified, quoted /DIR value. Normalize
          # PowerShell's mixed-separator Join-Path result before passing it to
          # the native installer so the requested test directory is unambiguous.
          $installRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'dist/verify-installer-app')).Replace('/', '\')
          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          $installDirArgument = '/DIR="' + $installRoot + '"'
          $setupProcess = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', $installDirArgument) -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) { throw "Silent setup install failed with exit code $($setupProcess.ExitCode)." }
          $installedHost = Join-Path $installRoot 'LocalAIRuntime.Desktop.exe'
          if (-not (Test-Path -LiteralPath $installedHost)) {
            $installedEntries = if (Test-Path -LiteralPath $installRoot) { (Get-ChildItem -LiteralPath $installRoot -Force | ForEach-Object Name) -join ', ' } else { '<install directory was not created>' }
            throw "Installed desktop shell executable is missing at '$installedHost'. Install directory entries: $installedEntries"
          }
          & $installedHost '--verify-install'
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop shell package verification failed.' }
          foreach ($relativePath in @('local-ai-runtime.exe', 'web/index.html', 'web/desktop-shell.json', 'scripts/Start-LocalAIRuntime.ps1', 'scripts/Apply-LocalAIRuntimeUpdate.ps1', 'scripts/Apply-LocalAIRuntimeDesktopUpdate.ps1', 'local-ai-runtime.ico')) {
            if (-not (Test-Path (Join-Path $installRoot $relativePath))) { throw "Installed payload is missing $relativePath." }
          }
          $uninstaller = Join-Path $installRoot 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Inno Setup uninstaller was not registered.' }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/desktop_update_smoke.ps1') -InstallerPath $setup -InstallRoot $installRoot -HelperPath (Join-Path $env:GITHUB_WORKSPACE 'scripts/Apply-LocalAIRuntimeDesktopUpdate.ps1') -Version $version
          $uninstallLog = Join-Path $env:GITHUB_WORKSPACE 'dist/uninstall-verification.log'
          & $uninstaller '/VERYSILENT' '/SUPPRESSMSGBOXES' '/NORESTART' "/LOG=$uninstallLog"
          if ($LASTEXITCODE -ne 0) { throw "Silent uninstall failed with exit code $LASTEXITCODE. Log: $uninstallLog" }
          # Inno Setup's uninstaller can return while its temporary clone finishes
          # post-uninstall cleanup. Wait for the installed host to disappear instead
          # of racing the clone with an immediate Test-Path check.
          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(15)
          while ((Test-Path -LiteralPath $installedHost) -and [DateTime]::UtcNow -lt $uninstallDeadline) {
            Start-Sleep -Milliseconds 200
          }
          if (Test-Path -LiteralPath $installedHost) {
            $remainingEntries = if (Test-Path -LiteralPath $installRoot) {
              (Get-ChildItem -LiteralPath $installRoot -Force -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName) -join [Environment]::NewLine
            } else { '<install directory has been removed>' }
            $uninstallTail = if (Test-Path -LiteralPath $uninstallLog) { (Get-Content -LiteralPath $uninstallLog -Tail 40) -join [Environment]::NewLine } else { '<uninstall log was not created>' }
            throw "Desktop application files remain after uninstallation. Remaining entries:`n$remainingEntries`nUninstall log ($uninstallLog):`n$uninstallTail"
          }
          Get-FileHash $package, $setup -Algorithm SHA256 | Format-List
          } finally {
            $packageTimer.Stop()
            "seconds=$([math]::Round($packageTimer.Elapsed.TotalSeconds, 2))" >> $env:GITHUB_OUTPUT
          }

      - name: Upload Windows configure diagnostics on failure
        if: ${{ always() && steps.configure.outcome == 'failure' && hashFiles('configure-vcpkg.log') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-configure-diagnostics-${{ github.sha }}
          path: configure-vcpkg.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows test diagnostics on failure
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-diagnostics-${{ github.sha }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows update-apply smoke diagnostics on failure
        if: ${{ failure() && steps.package.outcome == 'failure' && hashFiles('dist/update-smoke-diagnostics/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-update-smoke-diagnostics-${{ github.sha }}
          path: dist/update-smoke-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows package
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-windows-x64
          path: dist/local-ai-runtime-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows desktop installer
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-windows-installer
          path: dist/local-ai-runtime-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish CI performance summary
        if: ${{ always() }}
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.vcpkg-cache.outputs.cache-matched-key }}
          CACHE_IDENTITY: ${{ steps.vcpkg-cache-identity.outputs.identity }}
          CACHE_RESTORE_SECONDS: ${{ steps.cache-restore-duration.outputs.seconds }}
          CONFIGURE_SECONDS: ${{ steps.configure.outputs.seconds }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          TEST_SECONDS: ${{ steps.test.outputs.seconds }}
          PACKAGE_SECONDS: ${{ steps.package.outputs.seconds }}
          BINARY_CACHE_FILES: ${{ steps.vcpkg-cache-stats.outputs.binary_files }}
          BINARY_CACHE_MB: ${{ steps.vcpkg-cache-stats.outputs.binary_mb }}
          DOWNLOAD_CACHE_FILES: ${{ steps.vcpkg-cache-stats.outputs.download_files }}
          DOWNLOAD_CACHE_MB: ${{ steps.vcpkg-cache-stats.outputs.download_mb }}
          JOB_START_EPOCH: ${{ steps.timing-start.outputs.epoch }}
        run: |
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $total = if ($env:JOB_START_EPOCH) { [math]::Max(0, $now - [long]$env:JOB_START_EPOCH) } else { 'n/a' }
          $hit = if ($env:CACHE_HIT -eq 'true') { 'exact hit' } elseif ($env:CACHE_MATCHED_KEY) { 'compatible fallback hit' } else { 'miss' }
          $rows = @(
            '## CI performance — Windows x64',
            '',
            '| Stage | Duration / result |',
            '|---|---:|',
            "| vcpkg cache restore | $hit |",
            "| Cache identity | $($env:CACHE_IDENTITY) |",
            "| Matched key | $($env:CACHE_MATCHED_KEY) |",
            "| Cache restore duration | $($env:CACHE_RESTORE_SECONDS) s |",
            "| Configure (includes vcpkg) | $($env:CONFIGURE_SECONDS) s |",
            "| Build | $($env:BUILD_SECONDS) s |",
            "| Tests | $($env:TEST_SECONDS) s |",
            "| Package + extracted-package smoke test | $($env:PACKAGE_SECONDS) s |",
            "| Binary cache after configure | $($env:BINARY_CACHE_FILES) files / $($env:BINARY_CACHE_MB) MiB |",
            "| Source/tool downloads cache after configure | $($env:DOWNLOAD_CACHE_FILES) files / $($env:DOWNLOAD_CACHE_MB) MiB |",
            "| Elapsed after checkout (runner queue excluded) | $total s |",
            '',
            'GitHub runner queue time is shown separately by the Actions run details.'
          )
          $rows | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  linux:
    needs: [plan]
    if: ${{ github.event_name != 'schedule' }}
    name: Linux x64 build / test / package
    runs-on: ubuntu-24.04
    env:
      LAR_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Record job start time
        id: timing-start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate web assets and manifests
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check site/app.js
          node tests/site_smoke.js
          python -m json.tool site/product.json >/dev/null
          python -m json.tool config/engines.example.json >/dev/null
          python -m json.tool web/locales/en.json >/dev/null
          python -m json.tool web/locales/tr.json >/dev/null
          python -m json.tool catalog/schemas/activity-v1.schema.json >/dev/null

      - name: Install dependencies
        id: dependencies
        shell: bash
        run: |
          set +e
          started=$SECONDS
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config patchelf pax-utils libboost-dev libcurl4-openssl-dev libarchive-dev libssl-dev
          result=$?
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Configure
        id: configure
        shell: bash
        run: |
          set +e
          started=$SECONDS
          VERSION="${LAR_RELEASE_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Invalid release version: $VERSION" >&2; result=1; else cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DLAR_VERSION=${VERSION}" -DLAR_BUILD_TESTS=ON; result=$?; fi
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          started=$SECONDS
          cmake --build build --parallel 2
          result=$?
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Verify executable version
        shell: bash
        run: |
          expected="${LAR_RELEASE_VERSION#v}"
          actual="$(./build/local-ai-runtime --version)"
          test "$actual" = "$expected"

      - name: Test
        id: test
        shell: bash
        run: |
          set +e
          started=$SECONDS
          ctest --test-dir build --output-on-failure
          result=$?
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Smoke-test Linux developer launcher (PR validation)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/start-runtime.sh > launcher-smoke.log 2>&1 &
          runtime_pid=$!
          cleanup() { kill -TERM "$runtime_pid" 2>/dev/null || true; wait "$runtime_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/lar-health.json; then ready=1; break; fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then cat launcher-smoke.log; exit 1; fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then cat launcher-smoke.log; echo 'Developer launcher did not become ready.' >&2; exit 1; fi
          grep -q '"status":"ok"' /tmp/lar-health.json

      - name: Package portable Linux runtime
        id: package
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          started=$SECONDS
          trap 'echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"' EXIT
          set -euo pipefail
          VERSION="${LAR_RELEASE_VERSION#v}"
          STAGE="$GITHUB_WORKSPACE/dist/stage"
          mkdir -p "$STAGE/web" "$STAGE/config" "$STAGE/scripts"
          install -m 0755 build/local-ai-runtime "$STAGE/local-ai-runtime"
          cp -R web/. "$STAGE/web/"
          cp config/engines.example.json "$STAGE/config/"
          cp LICENSE "$STAGE/"
          install -m 0755 scripts/start-runtime.sh "$STAGE/scripts/start-runtime.sh"
          install -m 0755 Start-LocalAIRuntime.sh "$STAGE/Start-LocalAIRuntime.sh"

          # Bundle non-glibc shared dependencies so a user does not have to
          # install curl/archive/OpenSSL development packages just to launch.
          # glibc and the dynamic loader remain system requirements for ABI safety.
          mkdir -p "$STAGE/lib"
          while IFS= read -r library; do
            [[ "$library" = /* && -f "$library" ]] || continue
            base="$(basename "$library")"
            case "$base" in
              linux-vdso.so*|ld-linux*|libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libresolv.so*|libutil.so*|libnss_*.so*|libanl.so*) continue ;;
            esac
            [[ -e "$STAGE/lib/$base" ]] || cp -L "$library" "$STAGE/lib/$base"
            # lddtree may report a real versioned file while ELF DT_NEEDED uses
            # its SONAME (for example libfoo.so.1). Preserve that lookup name.
            soname="$(patchelf --print-soname "$library" 2>/dev/null || true)"
            if [[ -n "$soname" && ! -e "$STAGE/lib/$soname" ]]; then
              ln -s "$base" "$STAGE/lib/$soname"
            fi
          done < <(lddtree -l "$STAGE/local-ai-runtime")
          for library in "$STAGE"/lib/*.so*; do
            [[ -f "$library" ]] || continue
            patchelf --force-rpath --set-rpath '$ORIGIN' "$library"
          done
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$STAGE/local-ai-runtime"
          missing_deps="$(ldd "$STAGE/local-ai-runtime" | grep 'not found' || true)"
          if [[ -n "$missing_deps" ]]; then
            echo "Linux package has unresolved shared libraries:" >&2
            echo "$missing_deps" >&2
            exit 1
          fi

          cat > "$STAGE/README-INSTALL.txt" <<EOF
          Local AI Runtime ${VERSION} — Linux x86_64

          Run: ./Start-LocalAIRuntime.sh

          This package bundles the non-glibc shared libraries used by the
          runtime. The host system must provide a compatible glibc. It does
          not include AI model weights or external inference engines.
          See the source repository README for model setup and security notes.
          EOF
          PACKAGE="$GITHUB_WORKSPACE/dist/local-ai-runtime-linux-x64.tar.gz"
          tar -C "$STAGE" -czf "$PACKAGE" .

          # Smoke-test the actual extracted archive, not only the build-tree binary.
          VERIFY="$GITHUB_WORKSPACE/dist/verify-linux"
          mkdir -p "$VERIFY"
          tar -xzf "$PACKAGE" -C "$VERIFY"
          test "$("$VERIFY/local-ai-runtime" --version)" = "$VERSION"
          test -f "$VERIFY/web/index.html"
          test -f "$VERIFY/web/locales/en.json"
          test -f "$VERIFY/web/locales/tr.json"
          test -x "$VERIFY/scripts/start-runtime.sh"
          test -x "$VERIFY/Start-LocalAIRuntime.sh"
          missing_deps="$(ldd "$VERIFY/local-ai-runtime" | grep 'not found' || true)"
          if [[ -n "$missing_deps" ]]; then
            echo "Extracted Linux package has unresolved shared libraries:" >&2
            echo "$missing_deps" >&2
            exit 1
          fi

          # Validate the actual user-facing launcher and per-user config path,
          # not just the extracted executable's --version output.
          XDG_DATA_HOME="$VERIFY/user-data" "$VERIFY/scripts/start-runtime.sh" >"$VERIFY/runtime-smoke.log" 2>&1 &
          runtime_pid=$!
          cleanup_runtime() {
            kill -TERM "$runtime_pid" 2>/dev/null || true
            wait "$runtime_pid" 2>/dev/null || true
          }
          trap cleanup_runtime EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health >"$VERIFY/health.json"; then ready=1; break; fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then cat "$VERIFY/runtime-smoke.log"; exit 1; fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then cat "$VERIFY/runtime-smoke.log"; echo 'Extracted Linux release package did not pass /health within 10 seconds.' >&2; exit 1; fi
          grep -q '"status":"ok"' "$VERIFY/health.json"
          cleanup_runtime
          trap - EXIT
          sha256sum "$PACKAGE"

      - name: Upload Linux package
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-linux-x64
          path: dist/local-ai-runtime-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux test diagnostics on failure
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-diagnostics-${{ github.sha }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish CI performance summary
        if: ${{ always() }}
        shell: bash
        env:
          DEPENDENCY_SECONDS: ${{ steps.dependencies.outputs.seconds }}
          CONFIGURE_SECONDS: ${{ steps.configure.outputs.seconds }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          TEST_SECONDS: ${{ steps.test.outputs.seconds }}
          PACKAGE_SECONDS: ${{ steps.package.outputs.seconds }}
          JOB_START_EPOCH: ${{ steps.timing-start.outputs.epoch }}
        run: |
          now=$(date +%s)
          total='n/a'
          if [[ "$JOB_START_EPOCH" =~ ^[0-9]+$ ]]; then total=$((now - JOB_START_EPOCH)); fi
          {
            echo '## CI performance — Linux x64'
            echo
            echo '| Stage | Duration |'
            echo '|---|---:|'
            echo "| Dependency install | ${DEPENDENCY_SECONDS:-n/a} s |"
            echo "| Configure | ${CONFIGURE_SECONDS:-n/a} s |"
            echo "| Build | ${BUILD_SECONDS:-n/a} s |"
            echo "| Tests | ${TEST_SECONDS:-n/a} s |"
            echo "| Package + extracted-package smoke test | ${PACKAGE_SECONDS:-n/a} s |"
            echo "| Elapsed after checkout (runner queue excluded) | ${total} s |"
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    needs: [plan]
    name: macOS ${{ matrix.arch }} build / test / package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      LAR_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    # macOS runners are slower for the full test + repeat-smoke + portable package path.
    # Individual CTest cases have their own shorter timeout so a hang fails diagnostically.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record job start time
        id: timing-start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate web assets and manifests
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check site/app.js
          node tests/site_smoke.js
          python -m json.tool site/product.json >/dev/null
          python -m json.tool config/engines.example.json >/dev/null
          python -m json.tool web/locales/en.json >/dev/null
          python -m json.tool web/locales/tr.json >/dev/null
          python -m json.tool catalog/schemas/activity-v1.schema.json >/dev/null

      - name: Install only missing native dependencies (no brew update)
        id: dependencies
        shell: bash
        run: |
          started=$SECONDS
          trap 'echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"' EXIT
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          for formula in boost curl libarchive openssl@3; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              echo "Installing prebuilt Homebrew bottle: $formula"
              if ! brew install --force-bottle "$formula"; then
                echo "::error title=macOS dependency bottle unavailable::$formula has no usable bottle on this runner; source builds are disabled to keep CI bounded."
                exit 1
              fi
            fi
          done
          for tool in cmake ninja pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              if [[ "$tool" == "pkg-config" ]]; then brew install --force-bottle pkg-config; else brew install --force-bottle "$tool"; fi
            fi
            command -v "$tool"
          done

      - name: Configure
        id: configure
        shell: bash
        run: |
          started=$SECONDS
          trap 'echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"' EXIT
          set -euo pipefail
          PREFIX_PATH="$(brew --prefix curl);$(brew --prefix libarchive);$(brew --prefix openssl@3)"
          VERSION="${LAR_RELEASE_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version: $VERSION" >&2; exit 1; }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${PREFIX_PATH}" "-DLAR_VERSION=${VERSION}" -DLAR_BUILD_TESTS=ON

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          started=$SECONDS
          cmake --build build --parallel 2
          result=$?
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Verify executable version
        shell: bash
        run: |
          expected="${LAR_RELEASE_VERSION#v}"
          actual="$(./build/local-ai-runtime --version)"
          test "$actual" = "$expected"

      - name: Test
        id: test
        shell: bash
        run: |
          set +e
          started=$SECONDS
          # Verbose output identifies the exact core-test stage if a platform stalls.
          ctest --test-dir build --output-on-failure --verbose
          result=$?
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Repeat HTTP smoke test
        id: repeat-http
        shell: bash
        run: |
          set +e
          started=$SECONDS
          ctest --test-dir build -C Release --repeat until-fail:3 -R '^lar_http_smoke$' --output-on-failure
          result=$?
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Smoke-test macOS developer launcher
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/lar-developer-data" ./scripts/start-runtime.sh >launcher-smoke.log 2>&1 &
          runtime_pid=$!
          cleanup() { kill -TERM "$runtime_pid" 2>/dev/null || true; wait "$runtime_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health >"$RUNNER_TEMP/lar-health.json"; then ready=1; break; fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then cat launcher-smoke.log; exit 1; fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then cat launcher-smoke.log; echo 'macOS developer launcher did not become ready.' >&2; exit 1; fi
          grep -q '"status":"ok"' "$RUNNER_TEMP/lar-health.json"

      - name: Package and smoke-test portable macOS runtime
        id: package
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          started=$SECONDS
          trap 'echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"' EXIT
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          VERSION="${LAR_RELEASE_VERSION#v}"
          PACKAGE="$GITHUB_WORKSPACE/dist/local-ai-runtime-macos-${{ matrix.arch }}.tar.gz"
          STAGE="$GITHUB_WORKSPACE/dist/stage-macos-${{ matrix.arch }}"
          python scripts/package-macos.py \
            --binary build/local-ai-runtime \
            --web-dir web \
            --config config/engines.example.json \
            --license LICENSE \
            --launcher scripts/start-runtime.sh \
            --user-launcher Start-LocalAIRuntime.command \
            --stage "$STAGE" \
            --package "$PACKAGE" \
            --version "$VERSION" \
            --arch "${{ matrix.arch }}"

          VERIFY="$GITHUB_WORKSPACE/dist/verify-macos-${{ matrix.arch }}"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          tar -xzf "$PACKAGE" -C "$VERIFY"
          test "$("$VERIFY/local-ai-runtime" --version)" = "$VERSION"
          test -f "$VERIFY/web/index.html"
          test -f "$VERIFY/web/locales/en.json"
          test -f "$VERIFY/web/locales/tr.json"
          test -x "$VERIFY/scripts/start-runtime.sh"
          test -x "$VERIFY/Start-LocalAIRuntime.command"
          if otool -L "$VERIFY/local-ai-runtime" | grep -E '/opt/homebrew/|/usr/local/Cellar/|/usr/local/opt/'; then
            echo 'Extracted macOS package still references Homebrew absolute paths.' >&2
            exit 1
          fi

          XDG_DATA_HOME="$VERIFY/user-data" "$VERIFY/scripts/start-runtime.sh" >"$VERIFY/runtime-smoke.log" 2>&1 &
          runtime_pid=$!
          cleanup_runtime() { kill -TERM "$runtime_pid" 2>/dev/null || true; wait "$runtime_pid" 2>/dev/null || true; }
          trap cleanup_runtime EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health >"$VERIFY/health.json"; then ready=1; break; fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then cat "$VERIFY/runtime-smoke.log"; exit 1; fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then cat "$VERIFY/runtime-smoke.log"; echo 'Extracted macOS package did not pass /health within 10 seconds.' >&2; exit 1; fi
          grep -q '"status":"ok"' "$VERIFY/health.json"
          cleanup_runtime
          trap - EXIT
          shasum -a 256 "$PACKAGE"

      - name: Upload macOS package
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-macos-${{ matrix.arch }}
          path: dist/local-ai-runtime-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-diagnostics-${{ matrix.arch }}-${{ github.sha }}
          path: |
            launcher-smoke.log
            dist/verify-macos-${{ matrix.arch }}/runtime-smoke.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish CI performance summary
        if: ${{ always() }}
        shell: bash
        env:
          DEPENDENCY_SECONDS: ${{ steps.dependencies.outputs.seconds }}
          CONFIGURE_SECONDS: ${{ steps.configure.outputs.seconds }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          TEST_SECONDS: ${{ steps.test.outputs.seconds }}
          REPEAT_HTTP_SECONDS: ${{ steps.repeat-http.outputs.seconds }}
          PACKAGE_SECONDS: ${{ steps.package.outputs.seconds }}
          JOB_START_EPOCH: ${{ steps.timing-start.outputs.epoch }}
        run: |
          now=$(date +%s)
          total='n/a'
          if [[ "$JOB_START_EPOCH" =~ ^[0-9]+$ ]]; then total=$((now - JOB_START_EPOCH)); fi
          {
            echo '## CI performance — macOS ${{ matrix.arch }}'
            echo
            echo '| Stage | Duration |'
            echo '|---|---:|'
            echo "| Dependency install | ${DEPENDENCY_SECONDS:-n/a} s |"
            echo "| Configure | ${CONFIGURE_SECONDS:-n/a} s |"
            echo "| Build | ${BUILD_SECONDS:-n/a} s |"
            echo "| Tests | ${TEST_SECONDS:-n/a} s |"
            echo "| Repeated HTTP smoke test (3 runs) | ${REPEAT_HTTP_SECONDS:-n/a} s |"
            echo "| Package + extracted-package smoke test | ${PACKAGE_SECONDS:-n/a} s |"
            echo "| Elapsed after checkout (runner queue excluded) | ${total} s |"
            echo
            echo 'GitHub runner queue time is shown separately by the Actions run details.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Tag and publish tested artifacts
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [plan, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the exact tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download packages produced by this run
        uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: release-assets
          merge-multiple: true

      - name: Verify release payload and write checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$TAG_NAME" ]] || { echo 'Release tag was not planned.' >&2; exit 1; }
          [[ "${TAG_NAME#v}" == "$RELEASE_VERSION" ]] || { echo 'Tag/version mismatch.' >&2; exit 1; }
          test -s release-assets/local-ai-runtime-windows-x64.zip
          test -s release-assets/local-ai-runtime-windows-x64-setup.exe
          test -s release-assets/local-ai-runtime-linux-x64.tar.gz
          test -s release-assets/local-ai-runtime-macos-x64.tar.gz
          test -s release-assets/local-ai-runtime-macos-arm64.tar.gz
          cd release-assets
          sha256sum \
            local-ai-runtime-windows-x64-setup.exe \
            local-ai-runtime-windows-x64.zip \
            local-ai-runtime-linux-x64.tar.gz \
            local-ai-runtime-macos-x64.tar.gz \
            local-ai-runtime-macos-arm64.tar.gz > SHA256SUMS.txt
          {
            echo "Commit: $GITHUB_SHA"
            echo "Version: $RELEASE_VERSION"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > RELEASE-METADATA.txt

      - name: Create or verify the immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          [[ "$actual_commit" == "$GITHUB_SHA" ]] || { echo 'Release checkout is not the tested commit.' >&2; exit 1; }
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            tag_commit="$(git rev-list -n 1 "$TAG_NAME")"
            [[ "$tag_commit" == "$GITHUB_SHA" ]] || { echo "Tag $TAG_NAME already points to another commit." >&2; exit 1; }
          else
            git config user.name 'Local AI Runtime Release Bot'
            git config user.email 'local-ai-runtime-release-bot@users.noreply.github.com'
            git tag -a "$TAG_NAME" "$GITHUB_SHA" -m "Local AI Runtime $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Publish the exact artifacts tested above
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            release_flags=()
            if [[ "$TAG_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
            gh release create "$TAG_NAME" release-assets/* \
              --verify-tag --target "$GITHUB_SHA" --title "$TAG_NAME" \
              --generate-notes "${release_flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          release_url="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo '## Release publication'
            echo
            echo "- Tag: \`$TAG_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Release: $release_url"
            echo '- Build policy: each platform artifact was built and tested once in this workflow run; release publication reused those exact files.'
          } >> "$GITHUB_STEP_SUMMARY"


  publish-pages:
    name: Publish website (after release gate)
    if: ${{ always() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish-release.result == 'success') || github.event_name == 'workflow_dispatch') }}
    needs: [plan, windows, linux, macos, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Validate site metadata
        run: python -m json.tool site/product.json >/dev/null

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5


  final-report:
    name: Final pipeline report
    if: ${{ always() }}
    needs: [plan, windows, linux, macos, publish-release, publish-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize all release stages
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          RELEASE_RESULT: ${{ needs.publish-release.result }}
          PAGES_RESULT: ${{ needs.publish-pages.result }}
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          status_label() {
            case "$1" in
              success) printf '✅ Passed' ;;
              failure) printf '❌ Failed' ;;
              cancelled) printf '⚪ Cancelled' ;;
              skipped) printf '— Skipped / not applicable' ;;
              *) printf '⏳ %s' "$1" ;;
            esac
          }
          {
            echo '# Local AI Runtime — Pipeline report'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build version: \`$BUILD_VERSION\`"
            if [[ -n "$RELEASE_TAG" ]]; then echo "- Release tag: \`$RELEASE_TAG\`"; else echo '- Release tag: none (validation/dry run)'; fi
            echo
            echo '| Stage | Result |'
            echo '|---|---|'
            echo "| Version planning | $(status_label "$PLAN_RESULT") |"
            echo "| Windows x64 build/test/package | $(status_label "$WINDOWS_RESULT") |"
            echo "| Linux x64 build/test/package | $(status_label "$LINUX_RESULT") |"
            echo "| macOS x64 + arm64 build/test/package | $(status_label "$MACOS_RESULT") |"
            echo "| Tag + GitHub Release | $(status_label "$RELEASE_RESULT") |"
            echo "| GitHub Pages | $(status_label "$PAGES_RESULT") |"
            echo
            echo "[Open this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"
