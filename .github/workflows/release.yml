name: Build/test preview packages; publish tagged releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build for a dry-run (for example 0.1.0-alpha). Does not publish a release.'
        required: true
        default: '0.1.0-alpha'
        type: string

permissions:
  contents: read

env:
  # Main-branch pushes publish CI preview artifacts only; version tags publish releases.
  LAR_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-dev') }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 package
    runs-on: windows-2022
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configure
        shell: pwsh
        run: |
          $version = $env:LAR_RELEASE_VERSION -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) { throw 'vcpkg is not available on this runner.' }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_MANIFEST_MODE=ON "-DLAR_VERSION=$version" -DLAR_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Verify executable version
        shell: pwsh
        run: |
          $expected = $env:LAR_RELEASE_VERSION -replace '^v', ''
          $actual = & .\build\Release\local-ai-runtime.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $expected) { throw "Version check failed: expected $expected; got $actual" }

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package portable Windows runtime
        shell: pwsh
        run: |
          $version = $env:LAR_RELEASE_VERSION -replace '^v', ''
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist/stage'
          New-Item -ItemType Directory -Force -Path $stage, (Join-Path $stage 'web'), (Join-Path $stage 'config'), (Join-Path $stage 'scripts') | Out-Null
          Copy-Item 'build/Release/local-ai-runtime.exe' $stage
          Copy-Item 'web/*' (Join-Path $stage 'web') -Recurse -Force
          Copy-Item 'config/engines.example.json' (Join-Path $stage 'config')
          Copy-Item 'LICENSE' $stage
          Copy-Item 'scripts/Start-LocalAIRuntime.ps1' (Join-Path $stage 'scripts')
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg_installed/x64-windows/bin'
          if (Test-Path $vcpkgBin) { Get-ChildItem $vcpkgBin -Filter '*.dll' | Copy-Item -Destination $stage -Force }
          @"
          Local AI Runtime $version — Windows x64

          First run: open PowerShell in this folder and run:
            .\scripts\Start-LocalAIRuntime.ps1

          Requirements: Windows 10/11 x64. This package includes the runtime,
          not AI model weights or external inference engines. See README.md in
          the source repository for engine configuration and security notes.
          "@ | Set-Content -Encoding utf8 (Join-Path $stage 'README-INSTALL.txt')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $package = Join-Path $env:GITHUB_WORKSPACE 'dist/local-ai-runtime-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $package -Force

          # Smoke-test the actual archive, not only the build-tree executable.
          $verify = Join-Path $env:GITHUB_WORKSPACE 'dist/verify-windows'
          if (Test-Path $verify) { Remove-Item -Recurse -Force $verify }
          Expand-Archive -Path $package -DestinationPath $verify -Force
          $actual = & (Join-Path $verify 'local-ai-runtime.exe') --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $version) { throw "Packaged Windows executable failed version check: $actual" }
          if (-not (Test-Path (Join-Path $verify 'web/index.html'))) { throw 'Packaged dashboard is missing.' }
          if (-not (Test-Path (Join-Path $verify 'scripts/Start-LocalAIRuntime.ps1'))) { throw 'Packaged Windows launcher is missing.' }

          # Validate that the extracted, relocatable package can actually serve HTTP.
          $runtime = $null
          try {
            $launcher = Join-Path $verify 'scripts/Start-LocalAIRuntime.ps1'
            $runtime = & $launcher -NoBrowser -PassThru
            if (-not $runtime -or -not $runtime.Id) { throw 'Packaged Windows launcher did not return the runtime process.' }
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($runtime.HasExited) { throw "Packaged runtime exited before health check (code $($runtime.ExitCode))." }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 1
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Extracted Windows release launcher did not pass /health within 10 seconds.' }
          } finally {
            if ($runtime -and -not $runtime.HasExited) {
              Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue
              try { Wait-Process -Id $runtime.Id -Timeout 5 -ErrorAction SilentlyContinue } catch { }
            }
          }
          Get-FileHash $package -Algorithm SHA256 | Format-List

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release-windows' || format('preview-windows-{0}', github.sha) }}
          path: dist/local-ai-runtime-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate web assets and manifests
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check site/app.js
          python -m json.tool site/product.json >/dev/null
          python -m json.tool config/engines.example.json >/dev/null

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config patchelf pax-utils libboost-dev libcurl4-openssl-dev libarchive-dev libssl-dev

      - name: Configure
        run: |
          VERSION="${LAR_RELEASE_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version: $VERSION" >&2; exit 1; }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DLAR_VERSION=${VERSION}" -DLAR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Verify executable version
        shell: bash
        run: |
          expected="${LAR_RELEASE_VERSION#v}"
          actual="$(./build/local-ai-runtime --version)"
          test "$actual" = "$expected"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package portable Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${LAR_RELEASE_VERSION#v}"
          STAGE="$GITHUB_WORKSPACE/dist/stage"
          mkdir -p "$STAGE/web" "$STAGE/config" "$STAGE/scripts"
          install -m 0755 build/local-ai-runtime "$STAGE/local-ai-runtime"
          cp web/* "$STAGE/web/"
          cp config/engines.example.json "$STAGE/config/"
          cp LICENSE "$STAGE/"
          install -m 0755 scripts/start-runtime.sh "$STAGE/scripts/start-runtime.sh"

          # Bundle non-glibc shared dependencies so a user does not have to
          # install curl/archive/OpenSSL development packages just to launch.
          # glibc and the dynamic loader remain system requirements for ABI safety.
          mkdir -p "$STAGE/lib"
          while IFS= read -r library; do
            [[ "$library" = /* && -f "$library" ]] || continue
            base="$(basename "$library")"
            case "$base" in
              linux-vdso.so*|ld-linux*|libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libresolv.so*|libutil.so*|libnss_*.so*|libanl.so*) continue ;;
            esac
            [[ -e "$STAGE/lib/$base" ]] || cp -L "$library" "$STAGE/lib/$base"
            # lddtree may report a real versioned file while ELF DT_NEEDED uses
            # its SONAME (for example libfoo.so.1). Preserve that lookup name.
            soname="$(patchelf --print-soname "$library" 2>/dev/null || true)"
            if [[ -n "$soname" && ! -e "$STAGE/lib/$soname" ]]; then
              ln -s "$base" "$STAGE/lib/$soname"
            fi
          done < <(lddtree -l "$STAGE/local-ai-runtime")
          for library in "$STAGE"/lib/*.so*; do
            [[ -f "$library" ]] || continue
            patchelf --force-rpath --set-rpath '$ORIGIN' "$library"
          done
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$STAGE/local-ai-runtime"
          missing_deps="$(ldd "$STAGE/local-ai-runtime" | grep 'not found' || true)"
          if [[ -n "$missing_deps" ]]; then
            echo "Linux package has unresolved shared libraries:" >&2
            echo "$missing_deps" >&2
            exit 1
          fi

          cat > "$STAGE/README-INSTALL.txt" <<EOF
          Local AI Runtime ${VERSION} — Linux x86_64

          Run: ./scripts/start-runtime.sh

          This package bundles the non-glibc shared libraries used by the
          runtime. The host system must provide a compatible glibc. It does
          not include AI model weights or external inference engines.
          See the source repository README for model setup and security notes.
          EOF
          PACKAGE="$GITHUB_WORKSPACE/dist/local-ai-runtime-linux-x64.tar.gz"
          tar -C "$STAGE" -czf "$PACKAGE" .

          # Smoke-test the actual extracted archive, not only the build-tree binary.
          VERIFY="$GITHUB_WORKSPACE/dist/verify-linux"
          mkdir -p "$VERIFY"
          tar -xzf "$PACKAGE" -C "$VERIFY"
          test "$("$VERIFY/local-ai-runtime" --version)" = "$VERSION"
          test -f "$VERIFY/web/index.html"
          test -x "$VERIFY/scripts/start-runtime.sh"
          missing_deps="$(ldd "$VERIFY/local-ai-runtime" | grep 'not found' || true)"
          if [[ -n "$missing_deps" ]]; then
            echo "Extracted Linux package has unresolved shared libraries:" >&2
            echo "$missing_deps" >&2
            exit 1
          fi

          # Validate the actual user-facing launcher and per-user config path,
          # not just the extracted executable's --version output.
          XDG_DATA_HOME="$VERIFY/user-data" "$VERIFY/scripts/start-runtime.sh" >"$VERIFY/runtime-smoke.log" 2>&1 &
          runtime_pid=$!
          cleanup_runtime() {
            kill -TERM "$runtime_pid" 2>/dev/null || true
            wait "$runtime_pid" 2>/dev/null || true
          }
          trap cleanup_runtime EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health >"$VERIFY/health.json"; then ready=1; break; fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then cat "$VERIFY/runtime-smoke.log"; exit 1; fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then cat "$VERIFY/runtime-smoke.log"; echo 'Extracted Linux release package did not pass /health within 10 seconds.' >&2; exit 1; fi
          grep -q '"status":"ok"' "$VERIFY/health.json"
          cleanup_runtime
          trap - EXIT
          sha256sum "$PACKAGE"

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release-linux' || format('preview-linux-{0}', github.sha) }}
          path: dist/local-ai-runtime-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/local-ai-runtime-windows-x64.zip
          test -s release-assets/local-ai-runtime-linux-x64.tar.gz
          cd release-assets
          sha256sum local-ai-runtime-windows-x64.zip local-ai-runtime-linux-x64.tar.gz > SHA256SUMS.txt
          cd ..
          if [[ "$TAG_NAME" == *-* ]]; then
            gh release create "$TAG_NAME" release-assets/* --verify-tag --title "$TAG_NAME" --generate-notes --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" release-assets/* --verify-tag --title "$TAG_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
